name: IntelliJ Platform Plugin Compatibility
on:
  push:
jobs:
  compatibility:
    name: Verify against IntelliJ IDEA 2025.1–2026.2
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and verify the plugin
        run: ./gradlew :ideaPlugin:buildPlugin :ideaPlugin:verifyPlugin
